apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voting-app-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["vote", "result", "worker"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voting-app-deployer
  namespace: default
subjects:
  - kind: User
    name: github-gke-deploy@voting-app-devops-gcp.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: voting-app-deployer
  apiGroup: rbac.authorization.k8s.io