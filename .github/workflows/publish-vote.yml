name: Publier vote sur GCP

on:
  push:
    branches: [main]
    paths:
      - 'vote/**'
      - 'result/**'
      - 'worker/**'
      - '.github/workflows/publish-vote.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        service: [vote, result, worker]
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE: europe-west1-docker.pkg.dev/voting-app-devops-gcp/voting-app/${{ matrix.service }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construire l'image du commit
        run: docker build --tag "$IMAGE:$GITHUB_SHA" "./$SERVICE"

      - name: Tester la page d'accueil
        if: matrix.service == 'vote'
        run: |
          docker run --detach --name vote-test --publish 127.0.0.1:18080:80 "$IMAGE:$GITHUB_SHA"
          trap 'docker rm -f vote-test >/dev/null' EXIT
          status=$(curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-all-errors \
            --max-time 5 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)
          echo "GET / a renvoyé HTTP $status"
          test "$status" = 200

      - name: Obtenir un accès temporaire à Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: voting-app-devops-gcp
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Préparer la CLI Google Cloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Publier l'image dans Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker push "$IMAGE:$GITHUB_SHA"

  deploy:
    needs: publier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_ROOT: europe-west1-docker.pkg.dev/voting-app-devops-gcp/voting-app

    steps:
      - name: S'authentifier auprès de Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: voting-app-devops-gcp
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-gke-deploy@voting-app-devops-gcp.iam.gserviceaccount.com

      - name: Installer les outils GKE
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl,gke-gcloud-auth-plugin

      - name: Connecter kubectl à voting-lab
        run: |
          gcloud container clusters get-credentials voting-lab \
            --project=voting-app-devops-gcp --zone=europe-west1-b

      - name: Déployer les images du commit
        run: |
          for service in vote result worker; do
            kubectl -n default set image "deployment/$service" \
              "$service=$IMAGE_ROOT/$service:$GITHUB_SHA"
          done

          for service in vote result worker; do
            kubectl -n default rollout status "deployment/$service" --timeout=120s
          done