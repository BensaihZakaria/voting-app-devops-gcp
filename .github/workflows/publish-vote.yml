name: Publier vote sur GCP

on:
  push:
    branches: [main]
    paths:
      - 'vote/**'
      - '.github/workflows/publish-vote.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VOTE_IMAGE: europe-west1-docker.pkg.dev/voting-app-devops-gcp/voting-app/vote

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construire l'image du commit
        run: docker build --tag "$VOTE_IMAGE:$GITHUB_SHA" ./vote

      - name: Tester la page d'accueil
        run: |
          docker run --detach --name vote-test --publish 127.0.0.1:18080:80 "$VOTE_IMAGE:$GITHUB_SHA"
          trap 'docker rm -f vote-test >/dev/null' EXIT
          status=$(curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-all-errors \
            --max-time 5 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)
          echo "GET / a renvoyé HTTP $status"
          test "$status" = 200

      - name: Obtenir un accès temporaire à Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: voting-app-devops-gcp
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Préparer la CLI Google Cloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Publier l'image dans Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker push "$VOTE_IMAGE:$GITHUB_SHA"
