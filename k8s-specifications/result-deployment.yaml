apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: europe-west1-docker.pkg.dev/voting-app-devops-gcp/voting-app/result:a1dc6124c81fcd738637860bd8e89b12dc859cd4
        name: result
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 192Mi
        ports:
        - containerPort: 80
          name: result
